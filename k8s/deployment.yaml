apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-demo-app
  namespace: harness-demo
  labels:
    app: harness-demo-app
spec:
  # 2 replicas so the rolling deployment actually shows zero-downtime behaviour.
  replicas: 2
  # Rolling update: bring up new pods before tearing old ones down.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: harness-demo-app
  template:
    metadata:
      labels:
        app: harness-demo-app
    spec:
      # Don't schedule onto control-plane in single-node clusters that taint it.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Hardcoded :latest tag — the CI stage pushes the latest tag on every
          # build (see pipeline.yaml line 89). imagePullPolicy: Always forces a
          # fresh pull so we always get the freshly built image.
          image: ykbundela/harness-demo-app:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_NAME
              value: harness-demo-app
            - name: PORT
              value: "8080"
          # Liveness: is the process responsive? If not, kubelet restarts the pod.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness: is the pod ready to receive traffic? Removed from Service if not.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          # Startup: gives slow-starting apps a grace window before liveness kicks in.
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
