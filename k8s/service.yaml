apiVersion: v1
kind: Service
metadata:
  name: harness-demo-app
  namespace: harness-demo
  labels:
    app: harness-demo-app
spec:
  # NodePort so it works on minikube/kind without an ingress controller.
  # In a real cluster you'd switch to ClusterIP + Ingress or LoadBalancer.
  type: NodePort
  selector:
    app: harness-demo-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
